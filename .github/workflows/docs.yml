name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'cmd/flowdoc/**'
      - 'go.mod'
      - 'go.sum'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Analysis is done by golang.org/x/tools/cmd/callgraph (pinned via the
      # `tool` directive in go.mod); flowdoc renders its edges into flows.json.
      - name: Generate code flows catalog (x/tools callgraph)
        run: go run ./cmd/flowdoc --generate

      - name: Validate code flows catalog
        run: go run ./cmd/flowdoc --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build MkDocs site
        run: python -m mkdocs build --clean

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
