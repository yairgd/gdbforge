name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Check import guardrails
        run: ./scripts/check_imports.sh

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [[ -n "$unformatted" ]]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
