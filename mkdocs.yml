site_name: gdbforge
site_description: Debug MCU firmware, embedded Linux apps, the Linux kernel and desktop programs from one terminal. gdbforge is a keyboard-driven, multi-pane GDB front-end that automates target bring-up with OpenOCD, J-Link, gdbserver and kgdb — and drives Delve for Go.
site_url: https://yairgd.github.io/gdbforge/
repo_url: https://github.com/yairgd/gdbforge
repo_name: yairgd/gdbforge
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: _site
# Helper scripts, notes, and the pre-MkDocs (Jekyll) viewer assets live in docs/ but
# must not be published as part of the site.
exclude_docs: |
  overrides/
  _includes/
  www/
  info.txt
  serve.sh
  setup-docs-venv.sh
  # Stray encoder leftovers in docs/media/ — gitignored, but a local build would
  # otherwise copy tens of MB of them into _site/.
  media/*.junk
  media/*.mp4.*

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.action.edit
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Home: README.md
  - Getting started:
      - User guide: USER_GUIDE.md
      - FAQ: FAQ.md
  - Debugging guides:
      - Linux applications (local and remote): EMBEDDED_LINUX_DEBUG.md
      - STM32 and Zephyr firmware: STM32_DEBUG.md
      - Zynq MPSoC (Cortex-A53 / R5): MPSOC_DEBUG.md
      - Linux kernel and kgdb: KERNEL_KGDB.md
  - Scripting:
      - Lua API: LUA_API.md
      - Plugins: PLUGINS.md
  - Reference:
      - Command system: COMMAND_SYSTEM.md
      - Input and keys: INPUT.md
      - Window management: WINDOW_MANAGEMENT.md
      - Exec shell: EXEC_SHELL.md
  - Internals:
      - Start here: INTERNALS.md
      - Architecture:
          - Overview: OVERVIEW.md
          - Architecture: ARCHITECTURE.md
          - PTY architecture: PTY_ARCHITECTURE.md
          - Debugger integration: DEBUGGER_INTEGRATION.md
          - Dependencies: DEPENDENCIES.md
          - Directory structure: DIRECTORY_STRUCTURE.md
      - Code flows:
          - Flow browser: flows/browser.md
      - Framework:
          - termforge documentation: https://yairgd.github.io/termforge/
      - Development:
          - Developer guide: DEVELOPER_GUIDE.md
          - Changelog: CHANGELOG.md
          - Roadmap: ROADMAP.md
          - Releasing: RELEASING.md
          - Hosting: HOSTING.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css?v=pz-box-16
  - stylesheets/flows-browser.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/vendor/panzoom.min.js
  - javascripts/mermaid-zoom.js?v=pz-box-15

plugins:
  - search

extra:
  seo:
    image: https://yairgd.github.io/gdbforge/media/gdbforge-demo-r5.gif
    image_alt: gdbforge Cortex-R5 / J-Link debugging demo
    author: gdbforge contributors

copyright: Copyright &copy; 2026 gdbforge contributors
