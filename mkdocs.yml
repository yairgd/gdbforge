site_name: gdbforge
site_description: Vim-inspired multi-pane terminal front-end for GDB and Delve
site_url: https://yairgd.github.io/gdbforge/
repo_url: https://github.com/yairgd/gdbforge
repo_name: yairgd/gdbforge
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: _site
exclude_docs: |
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.action.edit
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Home: README.md
  - User guide:
      - User Guide: USER_GUIDE.md
      - Lua API: LUA_API.md
      - Plugins: PLUGINS.md
      - Command System: COMMAND_SYSTEM.md
      - Exec Shell: EXEC_SHELL.md
      - Input: INPUT.md
      - Window Management: WINDOW_MANAGEMENT.md
  - Architecture:
      - Overview: OVERVIEW.md
      - Architecture: ARCHITECTURE.md
      - UI Architecture: UI_ARCHITECTURE.md
      - PTY Architecture: PTY_ARCHITECTURE.md
      - Debugger Integration: DEBUGGER_INTEGRATION.md
      - Rendering: RENDERING.md
      - Dependencies: DEPENDENCIES.md
      - Directory Structure: DIRECTORY_STRUCTURE.md
  - Development:
      - Developer Guide: DEVELOPER_GUIDE.md
      - Roadmap: ROADMAP.md
      - Releasing: RELEASING.md
      - Hosting: HOSTING.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

plugins:
  - search

extra:
  seo:
    image: https://yairgd.github.io/gdbforge/media/gdbforge-demo.gif
    image_alt: gdbforge terminal debugger interface
    author: gdbforge contributors

copyright: Copyright &copy; 2026 gdbforge contributors
