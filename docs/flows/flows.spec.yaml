# Curated gdbforge execution flows (source of truth).
# Generate JSON: go run ./cmd/flowdoc --generate
# Locations resolved via golang.org/x/tools/go/packages (Go official analyzer).

repo: yairgd/gdbforge
branch: main

packages:
  - ./cmd/...
  - ./internal/...

flows:
  - id: dlv-console-tab
    title: Delve console Tab (b main.)
    keywords: [tab, completion, wildmenu, dlv, delve, break, b main, ListFunctions, gdbTabComplete]
    trigger: "Focus :b gdb (debugger console), insert mode, type e.g. b main., press Tab"
    backend: [dlv]
    chain:
      - { symbol: handleInsertKey, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: handleInsertKey, indent: 0, note: "Tab intercepted; not forwarded to Delve PTY" }
      - { symbol: gdbTabComplete, pkg: cmd/gdbforge, recv: "(*completionCtl)", name: gdbTabComplete, indent: 1 }
      - { symbol: GDBWidget.InputText, pkg: internal/gdbforge/widgets, recv: "(*GDBWidget)", name: InputText, indent: 2, note: "Prefix scraped from xterm grid" }
      - { symbol: DLVBackend.Complete, pkg: internal/gdbforge/backend, recv: "(*DLVBackend)", name: Complete, indent: 2, branch: dlv }
      - { symbol: dlv.Complete, pkg: internal/dlv, name: Complete, indent: 3, branch: dlv }
      - { symbol: ListFunctionsFilter, pkg: internal/dlv, recv: "(*Client)", name: ListFunctionsFilter, indent: 4, branch: dlv, note: "rpc2 ListFunctions — not CLI funcs on PTY" }
      - { symbol: publishGDBMenu → CompletionMsg, pkg: cmd/gdbforge, recv: "(*completionCtl)", name: publishGDBMenu, indent: 2, note: "Wildmenu + ModeCompletion when multiple matches" }
    breakpoints:
      - main.(*completionCtl).gdbTabComplete
      - github.com/yairgd/gdbforge/internal/dlv.Complete
      - github.com/yairgd/gdbforge/internal/dlv.(*Client).ListFunctionsFilter

  - id: gdb-console-tab
    title: GDB console Tab (MI -complete)
    keywords: [tab, completion, gdb, mi, complete, gdbTabComplete]
    trigger: "Focus :b gdb, insert mode, press Tab on console input line"
    backend: [gdb]
    chain:
      - { symbol: handleInsertKey, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: handleInsertKey, indent: 0 }
      - { symbol: gdbTabComplete, pkg: cmd/gdbforge, recv: "(*completionCtl)", name: gdbTabComplete, indent: 1 }
      - { symbol: GDBBackend.Complete, pkg: internal/gdbforge/backend, recv: "(*GDBBackend)", name: Complete, indent: 2, branch: gdb }
      - { symbol: gdb.Complete, pkg: internal/gdb, name: Complete, indent: 3, branch: gdb, note: "Sends -complete on MI PTY" }
    breakpoints:
      - main.(*completionCtl).gdbTabComplete
      - github.com/yairgd/gdbforge/internal/gdb.Complete

  - id: debugger-console-ctrl-c
    title: Ctrl-C in debugger console
    keywords: [ctrl-c, interrupt, halt, sigint, confirm, p/q, activity]
    trigger: "Ctrl-C while gdbforge focused (any mode); copy selection wins if terminal has selection"
    backend: [gdb, dlv]
    chain:
      - { symbol: tryGlobalInterrupt, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: tryGlobalInterrupt, indent: 0 }
      - { symbol: onActivityCtrlC, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: onActivityCtrlC, indent: 1 }
      - { symbol: onGdbConsoleInterrupt, pkg: cmd/gdbforge, recv: "(*consoleCtl)", name: onGdbConsoleInterrupt, indent: 2, note: "Or onConfirmInterrupt if confirming" }
      - { symbol: DLVBackend.Interrupt, pkg: internal/gdbforge/backend, recv: "(*DLVBackend)", name: Interrupt, indent: 3, branch: dlv, note: "Delve: rpc2 Halt only" }
      - { symbol: Client.Interrupt, pkg: internal/dlv, recv: "(*Client)", name: Interrupt, indent: 4, branch: dlv }
    breakpoints:
      - main.(*DebuggerApp).onActivityCtrlC
      - main.(*consoleCtl).onGdbConsoleInterrupt

  - id: stop-pipeline
    title: Inferior stop → UI refresh
    keywords: [stop, breakpoint, stopped, code, threads, stack, console]
    trigger: "Debugger stops (breakpoint, step, signal); MI/Delve output parsed on UI thread"
    backend: [gdb, dlv]
    chain:
      - { symbol: handleDebuggerOutputMsg, pkg: cmd/gdbforge, recv: "(*consoleCtl)", name: handleDebuggerOutputMsg, indent: 0 }
      - { symbol: applyConsoleUpdate, pkg: cmd/gdbforge, recv: "(*consoleCtl)", name: applyConsoleUpdate, indent: 1 }
      - { symbol: applyStopAndPromptSideEffects, pkg: cmd/gdbforge, recv: "(*consoleCtl)", name: applyStopAndPromptSideEffects, indent: 2 }
      - { symbol: onGdbStopped, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: onGdbStopped, indent: 3 }
      - { symbol: runRefresh, pkg: cmd/gdbforge, recv: "(*debugInfoCtl)", name: runRefresh, indent: 3, note: "Coalesced threads/stack refresh" }
    breakpoints:
      - main.(*DebuggerApp).onGdbStopped
      - main.(*consoleCtl).applyConsoleUpdate

  - id: cmdline-tab
    title: "Cmdline Tab (: commands)"
    keywords: [tab, cmdline, command, colon, wildmenu, ":b"]
    trigger: "Normal/command mode, CmdWidget active, press Tab on : line"
    backend: [both]
    chain:
      - { symbol: handleCommandKey, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: handleCommandKey, indent: 0, note: "Tab in ModeCommand" }
      - { symbol: CmdWidget.CompletionNames, pkg: internal/termui, recv: "(*CmdWidget)", name: CompletionNames, indent: 1, note: "Command trie — not debugger MI" }
      - { symbol: refreshCmdMenu, pkg: cmd/gdbforge, recv: "(*completionCtl)", name: refreshCmdMenu, indent: 2 }
    breakpoints:
      - main.(*completionCtl).refreshCmdMenu

  - id: gdb-continue
    title: ":gdb continue"
    keywords: [continue, c, run control, exec]
    trigger: "User runs :gdb continue or bound key — resume inferior"
    backend: [gdb, dlv]
    chain:
      - { symbol: GdbContinue, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: GdbContinue, indent: 0 }
      - { symbol: sendGdbExec, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: sendGdbExec, indent: 1 }
      - { symbol: GDBBackend.ExecUI, pkg: internal/gdbforge/backend, recv: "(*GDBBackend)", name: ExecUI, indent: 2, branch: gdb, note: "MI -exec-continue when available" }
      - { symbol: DLVBackend.ExecUI, pkg: internal/gdbforge/backend, recv: "(*DLVBackend)", name: ExecUI, indent: 2, branch: dlv, note: "CLI continue on connect PTY" }
    breakpoints:
      - main.(*DebuggerApp).GdbContinue
      - main.(*DebuggerApp).sendGdbExec

  - id: gdb-run
    title: ":gdb run / start"
    keywords: [run, start, inferior, exec]
    trigger: ":gdb run or :gdb start from command mode"
    backend: [gdb, dlv]
    chain:
      - { symbol: GdbRun, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: GdbRun, indent: 0 }
      - { symbol: sendGdbExec, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: sendGdbExec, indent: 1 }
      - { symbol: ExecUI, pkg: internal/gdbforge/backend, recv: "(*GDBBackend)", name: ExecUI, indent: 2, branch: gdb }
      - { symbol: ExecUI, pkg: internal/gdbforge/backend, recv: "(*DLVBackend)", name: ExecUI, indent: 2, branch: dlv }
    breakpoints:
      - main.(*DebuggerApp).GdbRun

  - id: code-break-toggle
    title: Toggle breakpoint in Code pane
    keywords: [breakpoint, f9, code, gutter, toggle]
    trigger: "Breakpoint key in Code widget or gutter click"
    backend: [gdb, dlv]
    chain:
      - { symbol: onCodeBreakToggle, pkg: cmd/gdbforge, recv: "(*breakCtl)", name: onCodeBreakToggle, indent: 0 }
      - { symbol: applyBreakIntent, pkg: cmd/gdbforge, recv: "(*breakCtl)", name: applyBreakIntent, indent: 1 }
      - { symbol: sendBreakpointCmd, pkg: cmd/gdbforge, recv: "(*breakCtl)", name: sendBreakpointCmd, indent: 2 }
    breakpoints:
      - main.(*breakCtl).onCodeBreakToggle

  - id: callstack-select
    title: Call stack row → source pane
    keywords: [call stack, frame, source, navigation]
    trigger: "Activate a row in the Call Stack pane"
    backend: [gdb, dlv]
    chain:
      - { symbol: onCallStackActivate, pkg: cmd/gdbforge, recv: "(*debugInfoCtl)", name: onCallStackActivate, indent: 0 }
      - { symbol: activateCallStack, pkg: cmd/gdbforge, recv: "(*debugInfoCtl)", name: activateCallStack, indent: 1 }
      - { symbol: SelectFrame, pkg: internal/gdbforge/backend, recv: "(*GDBBackend)", name: SelectFrame, indent: 2, branch: gdb }
      - { symbol: showFrameSource, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: showFrameSource, indent: 2 }
    breakpoints:
      - main.(*debugInfoCtl).activateCallStack

  - id: thread-select
    title: Threads pane row select
    keywords: [threads, thread, switch]
    trigger: "Activate a row in the Threads pane"
    backend: [gdb, dlv]
    chain:
      - { symbol: onThreadActivate, pkg: cmd/gdbforge, recv: "(*debugInfoCtl)", name: onThreadActivate, indent: 0 }
      - { symbol: activateThread, pkg: cmd/gdbforge, recv: "(*debugInfoCtl)", name: activateThread, indent: 1 }
      - { symbol: SelectThread, pkg: internal/gdbforge/backend, recv: "(*GDBBackend)", name: SelectThread, indent: 2, branch: gdb }
      - { symbol: SelectThread, pkg: internal/gdbforge/backend, recv: "(*DLVBackend)", name: SelectThread, indent: 2, branch: dlv }
    breakpoints:
      - main.(*debugInfoCtl).activateThread

  - id: lua-console-tab
    title: Lua REPL Tab completion
    keywords: [lua, tab, repl, completion, wildmenu]
    trigger: "Focus Lua console, insert mode, press Tab"
    backend: [both]
    chain:
      - { symbol: handleInsertKey, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: handleInsertKey, indent: 0, note: "Lua console branch" }
      - { symbol: luaTabComplete, pkg: cmd/gdbforge, recv: "(*completionCtl)", name: luaTabComplete, indent: 1 }
      - { symbol: LuaGdbforgeComplete, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: LuaGdbforgeComplete, indent: 2 }
    breakpoints:
      - main.(*completionCtl).luaTabComplete

  - id: confirm-interrupt
    title: Ctrl-C during confirm gate
    keywords: [confirm, ctrl-c, quit, y/n, p/q, delve]
    trigger: "Ctrl-C while quit or Delve multiclient confirm is open"
    backend: [gdb, dlv]
    chain:
      - { symbol: onConfirmInterrupt, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: onConfirmInterrupt, indent: 0 }
      - { symbol: onConfirmingInterrupt, pkg: cmd/gdbforge, recv: "(*consoleCtl)", name: onConfirmingInterrupt, indent: 1 }
    breakpoints:
      - main.(*DebuggerApp).onConfirmInterrupt

  - id: inferior-io-internal
    title: ":set inferior internal (:b io)"
    keywords: [inferior, io, tty, internal, b io]
    trigger: ":set inferior-tty internal or equivalent — route inferior I/O to :b io pane"
    backend: [gdb, dlv]
    chain:
      - { symbol: SetInferiorInternal, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: SetInferiorInternal, indent: 0 }
      - { symbol: syncInferiorIOView, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: syncInferiorIOView, indent: 1 }
    breakpoints:
      - main.(*DebuggerApp).SetInferiorInternal

  - id: quit-ctrl-d
    title: Ctrl-D / quit confirm
    keywords: [quit, ctrl-d, eof, confirm]
    trigger: "Ctrl-D on debugger console or quit flow opening confirm gate"
    backend: [gdb, dlv]
    chain:
      - { symbol: onConfirmCtrlD, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: onConfirmCtrlD, indent: 0 }
      - { symbol: onGdbConsoleEOF, pkg: cmd/gdbforge, recv: "(*consoleCtl)", name: onGdbConsoleEOF, indent: 1 }
    breakpoints:
      - main.(*DebuggerApp).onConfirmCtrlD

  - id: layout-apply
    title: ":layout apply"
    keywords: [layout, workspace, panes, tabs]
    trigger: ":layout command selects a named workspace layout"
    backend: [both]
    chain:
      - { symbol: OnLayout, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: OnLayout, indent: 0 }
      - { symbol: ApplyLayout, pkg: cmd/gdbforge, recv: "(*LayoutShell)", name: ApplyLayout, indent: 1 }
      - { symbol: buildLayoutTree, pkg: cmd/gdbforge, recv: "(*LayoutShell)", name: buildLayoutTree, indent: 2 }
    breakpoints:
      - main.(*DebuggerApp).OnLayout

  - id: gdb-interrupt-cmd
    title: ":gdb interrupt command"
    keywords: [interrupt, halt, gdb interrupt]
    trigger: ":gdb interrupt or interrupt keybinding"
    backend: [gdb, dlv]
    chain:
      - { symbol: GdbInterrupt, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: GdbInterrupt, indent: 0 }
      - { symbol: onGdbConsoleInterrupt, pkg: cmd/gdbforge, recv: "(*consoleCtl)", name: onGdbConsoleInterrupt, indent: 1 }
    breakpoints:
      - main.(*DebuggerApp).GdbInterrupt

  - id: gdb-next
    title: ":gdb next"
    keywords: [next, n, step, run control]
    trigger: "Bound key or :gdb next while stopped"
    backend: [gdb, dlv]
    chain:
      - { symbol: GdbNext, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: GdbNext, indent: 0 }
      - { symbol: sendGdbExec, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: sendGdbExec, indent: 1 }
      - { symbol: ExecUI, pkg: internal/gdbforge/backend, recv: "(*GDBBackend)", name: ExecUI, indent: 2, branch: gdb }
      - { symbol: ExecUI, pkg: internal/gdbforge/backend, recv: "(*DLVBackend)", name: ExecUI, indent: 2, branch: dlv }

  - id: gdb-step
    title: ":gdb step"
    keywords: [step, s, run control]
    trigger: "Bound key or :gdb step while stopped"
    backend: [gdb, dlv]
    chain:
      - { symbol: GdbStep, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: GdbStep, indent: 0 }
      - { symbol: sendGdbExec, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: sendGdbExec, indent: 1 }
      - { symbol: ExecUI, pkg: internal/gdbforge/backend, recv: "(*GDBBackend)", name: ExecUI, indent: 2, branch: gdb }
      - { symbol: ExecUI, pkg: internal/gdbforge/backend, recv: "(*DLVBackend)", name: ExecUI, indent: 2, branch: dlv }

  - id: normal-mode-keys
    title: Normal mode key dispatch
    keywords: [normal, mode, keys, vim]
    trigger: "Normal mode with focus on a pane (not insert/command)"
    backend: [both]
    chain:
      - { symbol: handleNormalKey, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: handleNormalKey, indent: 0 }

  - id: show-code-at-stop
    title: Stop → Code pane highlight
    keywords: [code, stop, highlight, location]
    trigger: "After onGdbStopped when stop has file:line"
    backend: [gdb, dlv]
    chain:
      - { symbol: onGdbStopped, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: onGdbStopped, indent: 0 }
      - { symbol: updateCodeAfterStop, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: updateCodeAfterStop, indent: 1 }
      - { symbol: showCodeAt, pkg: cmd/gdbforge, recv: "(*bufferCtl)", name: showCodeAt, indent: 2 }

  - id: breakpoint-refresh
    title: Breakpoint list refresh
    keywords: [breakpoint, refresh, list]
    trigger: "After stop or break command — BP pane sync"
    backend: [gdb, dlv]
    chain:
      - { symbol: refreshAfterStop, pkg: cmd/gdbforge, recv: "(*breakCtl)", name: refreshAfterStop, indent: 0 }
      - { symbol: fetchInfos, pkg: cmd/gdbforge, recv: "(*breakCtl)", name: fetchInfos, indent: 1 }
      - { symbol: applyBreakInfos, pkg: cmd/gdbforge, recv: "(*breakCtl)", name: applyBreakInfos, indent: 2 }
      - { symbol: syncViews, pkg: cmd/gdbforge, recv: "(*breakCtl)", name: syncViews, indent: 3 }

  - id: exec-shell-cmd
    title: ":! exec shell"
    keywords: [exec, shell, bang, terminal]
    trigger: ":! command opens or focuses exec pane"
    backend: [both]
    chain:
      - { symbol: OnRun, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: OnRun, indent: 0 }
      - { symbol: startExecSession, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: startExecSession, indent: 1 }
  # --- Session startup & teardown ---
  - id: session-gdb-backend
    title: GDB backend startup (pre-TUI)
    keywords: [startup, gdb, spawn, mi, init]
    trigger: "Launch gdbforge with GDB (default); initBackend before TUI"
    backend: [gdb]
    chain:
      - { symbol: initBackend, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: initBackend, indent: 0 }
      - { symbol: NewGDBClientOpts, pkg: internal/gdb, name: NewGDBClientOpts, indent: 1, branch: gdb }
      - { symbol: NewGDB, pkg: internal/gdbforge/backend, name: NewGDB, indent: 2, branch: gdb, note: "Wraps client as GDBBackend" }

  - id: session-dlv-backend
    title: Delve backend startup (headless + connect)
    keywords: [startup, dlv, delve, headless, rpc2, connect]
    trigger: "Launch gdbforge with Delve backend (--dlv / config)"
    backend: [dlv]
    chain:
      - { symbol: initBackend, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: initBackend, indent: 0 }
      - { symbol: NewClientOpts, pkg: internal/dlv, name: NewClientOpts, indent: 1, branch: dlv }
      - { symbol: NewDLV, pkg: internal/gdbforge/backend, name: NewDLV, indent: 2, branch: dlv }

  - id: session-debug-init
    title: Debug session widget wiring
    keywords: [startup, session, gdb widget, console bridge, widgets]
    trigger: "After initBackend — DebugSession.init registers panes and starts PTY bridge"
    backend: [gdb, dlv]
    chain:
      - { symbol: initBuiltins, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: initBuiltins, indent: 0 }
      - { symbol: DebugSession.init, pkg: cmd/gdbforge, recv: "(*DebugSession)", name: init, indent: 1 }
      - { symbol: startGdbConsoleBridge, pkg: cmd/gdbforge, recv: "(*consoleCtl)", name: startGdbConsoleBridge, indent: 2 }
      - { symbol: restoreSaved, pkg: cmd/gdbforge, recv: "(*breakCtl)", name: restoreSaved, indent: 2, note: ".gdbforge/breakpoints.yaml" }

  - id: session-quit-save
    title: Quit — save breakpoints snapshot
    keywords: [quit, exit, breakpoints, save, yaml]
    trigger: "App Close() — persist breakpoint list to .gdbforge/breakpoints.yaml"
    backend: [gdb, dlv]
    chain:
      - { symbol: saveOnQuit, pkg: cmd/gdbforge, recv: "(*breakCtl)", name: saveOnQuit, indent: 0 }

  # --- Console I/O & stop pipeline ---
  - id: gdb-console-bridge
    title: Debugger PTY → UI event bridge
    keywords: [console, pty, coalesce, bridge, output]
    trigger: "Background read on debugger CLI PTY posts GdbOutputMsg to UI thread"
    backend: [gdb, dlv]
    chain:
      - { symbol: startGdbConsoleBridge, pkg: cmd/gdbforge, recv: "(*consoleCtl)", name: startGdbConsoleBridge, indent: 0 }
      - { symbol: handleDebuggerOutputMsg, pkg: cmd/gdbforge, recv: "(*consoleCtl)", name: handleDebuggerOutputMsg, indent: 1 }
      - { symbol: applyConsoleUpdate, pkg: cmd/gdbforge, recv: "(*consoleCtl)", name: applyConsoleUpdate, indent: 2 }

  - id: console-parse-gdb
    title: GDB MI/CLI output parsing
    keywords: [gdb, mi, parse, stopped, prompt, PushRaw]
    trigger: "Coalesced chunk from GDB PTY parsed into ConsoleUpdate"
    backend: [gdb]
    chain:
      - { symbol: handleDebuggerOutputMsg, pkg: cmd/gdbforge, recv: "(*consoleCtl)", name: handleDebuggerOutputMsg, indent: 0 }
      - { symbol: PushConsoleOutput, pkg: internal/gdbforge/backend, recv: "(*GDBBackend)", name: PushConsoleOutput, indent: 1, branch: gdb }
      - { symbol: PushRaw, pkg: internal/gdb, recv: "(*GdbInputState)", name: PushRaw, indent: 2, branch: gdb, note: "*stopped, ^running, stream records" }

  - id: console-parse-dlv
    title: Delve CLI output parsing
    keywords: [dlv, delve, parse, prompt, confirm]
    trigger: "Coalesced chunk from Delve connect PTY parsed into ConsoleUpdate"
    backend: [dlv]
    chain:
      - { symbol: handleDebuggerOutputMsg, pkg: cmd/gdbforge, recv: "(*consoleCtl)", name: handleDebuggerOutputMsg, indent: 0 }
      - { symbol: PushConsoleOutput, pkg: internal/gdbforge/backend, recv: "(*DLVBackend)", name: PushConsoleOutput, indent: 1, branch: dlv }
      - { symbol: PushRaw, pkg: internal/dlv, recv: "(*InputState)", name: PushRaw, indent: 2, branch: dlv }

  - id: stop-side-effects
    title: Stop/prompt side effects (refresh, BP, frame sync)
    keywords: [stop, prompt, frame, breakpoints, inferior running]
    trigger: "ConsoleUpdate after parse — applies stop, frame sync, BP changed, running flag"
    backend: [gdb, dlv]
    chain:
      - { symbol: applyConsoleUpdate, pkg: cmd/gdbforge, recv: "(*consoleCtl)", name: applyConsoleUpdate, indent: 0 }
      - { symbol: applyStopAndPromptSideEffects, pkg: cmd/gdbforge, recv: "(*consoleCtl)", name: applyStopAndPromptSideEffects, indent: 1 }
      - { symbol: onGdbStopped, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: onGdbStopped, indent: 2, note: "When Stopped != nil" }
      - { symbol: PublishBreakpointsChanged, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: PublishBreakpointsChanged, indent: 2, note: "When BreakpointsChanged" }

  - id: frame-sync-after-nav
    title: Frame sync after MI/Delve navigation
    keywords: [frame, sync, thread-selected, stack nav]
    trigger: "Prompt ready after frame/thread command — sync Code pane to selected frame"
    backend: [gdb, dlv]
    chain:
      - { symbol: applyStopAndPromptSideEffects, pkg: cmd/gdbforge, recv: "(*consoleCtl)", name: applyStopAndPromptSideEffects, indent: 0 }
      - { symbol: onGdbFrameSelected, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: onGdbFrameSelected, indent: 1 }
      - { symbol: showFrameSource, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: showFrameSource, indent: 2 }

  - id: debug-info-refresh
    title: Threads/stack refresh after stop
    keywords: [threads, stack, refresh, rpc2, mi]
    trigger: "Coalesced debug-info refresh scheduled after stop or thread switch"
    backend: [gdb, dlv]
    chain:
      - { symbol: runRefresh, pkg: cmd/gdbforge, recv: "(*debugInfoCtl)", name: runRefresh, indent: 0 }
      - { symbol: refreshThreadsAndStack, pkg: cmd/gdbforge, recv: "(*debugInfoCtl)", name: refreshThreadsAndStack, indent: 1 }
      - { symbol: RefreshThreadsAndStack, pkg: internal/gdbforge/backend, recv: "(*GDBBackend)", name: RefreshThreadsAndStack, indent: 2, branch: gdb }
      - { symbol: RefreshThreadsAndStack, pkg: internal/gdbforge/backend, recv: "(*DLVBackend)", name: RefreshThreadsAndStack, indent: 2, branch: dlv, note: "rpc2 ListGoroutines + Stacktrace" }

  # --- Run control (extended) ---
  - id: gdb-finish
    title: ":gdb finish"
    keywords: [finish, run control, step out]
    trigger: "Bound key or :gdb finish while stopped"
    backend: [gdb, dlv]
    chain:
      - { symbol: GdbFinish, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: GdbFinish, indent: 0 }
      - { symbol: sendGdbExec, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: sendGdbExec, indent: 1 }
      - { symbol: ExecUI, pkg: internal/gdbforge/backend, recv: "(*GDBBackend)", name: ExecUI, indent: 2, branch: gdb }
      - { symbol: ExecUI, pkg: internal/gdbforge/backend, recv: "(*DLVBackend)", name: ExecUI, indent: 2, branch: dlv }

  - id: gdb-nexti
    title: ":gdb nexti (step instruction)"
    keywords: [nexti, ni, instruction, run control]
    trigger: ":gdb nexti or bound key"
    backend: [gdb, dlv]
    chain:
      - { symbol: GdbNexti, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: GdbNexti, indent: 0 }
      - { symbol: sendGdbExec, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: sendGdbExec, indent: 1 }

  - id: gdb-stepi
    title: ":gdb stepi (step instruction)"
    keywords: [stepi, si, instruction, run control]
    trigger: ":gdb stepi or bound key"
    backend: [gdb, dlv]
    chain:
      - { symbol: GdbStepi, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: GdbStepi, indent: 0 }
      - { symbol: sendGdbExec, pkg: cmd/gdbforge, recv: "(*DebuggerApp)", name: sendGdbExec, indent: 1 }

  - id: gdb-info-registers
    title: ":gdb info registers"
    keywords: [registers, info, mi, console]
    trigger: ":gdb info registers — show register dump in console"
    backend: [gdb, dlv]
