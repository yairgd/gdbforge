# Automatic discovery — analysis performed by the official Go call-graph tool:
#   golang.org/x/tools/cmd/callgraph  (pinned in go.mod, run as `go tool callgraph`)
# flowdoc only parses its edges and renders trees; it does not do its own analysis.
discover:
  enabled: true
  algo: vta                 # callgraph -algo: static | cha | rta | vta
  analyze_packages:
    - ./cmd/gdbforge        # rta/vta need a main package for reachability
  entry_prefixes:           # which packages become flow roots
    - cmd/gdbforge
    - internal/gdbforge
    - internal/dlv
    - internal/gdb
    - internal/termui
    - internal/commands
    - internal/ptyx
    - internal/luahost
  include_prefixes:         # edges kept in the rendered trees
    - cmd/gdbforge
    - internal
  skip_prefixes:
    - internal/luahost/embedded
  max_depth: 5
  max_steps: 24
  min_steps: 3
  branching: 4
  max_flows: 0              # 0 = no limit
