# Digilent JTAG-HS2 + Zynq UltraScale+ MPSoC Cortex-A53.
# Used by :lua a53_baremetal_openocd_digilent / :lua a53_kernel_openocd_digilent
#
# Set A53_CORE before sourcing (0–3; default 0):
#   openocd -c "set A53_CORE 0" -f a53_openocd_digilent.cfg
#
# Assumes FSBL already ran for bare-metal load. Selected APU core gets the
# default GDB port; other cores' gdb-port is disabled.

# Inline HS2 (OpenOCD digilent-hs2.cfg expects "Digilent Adept USB Device";
# many probes report "Digilent USB Device" — match by vid/pid only).
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
reset_config none
transport select jtag

if { [info exists ADAPTER_KHZ] } {
	adapter speed $ADAPTER_KHZ
} else {
	adapter speed 4000
}

if { ![info exists A53_CORE] } {
	set A53_CORE 0
}

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME uscale
}

if { [info exists DAP_TAPID] } {
	set _DAP_TAPID $DAP_TAPID
} else {
	set _DAP_TAPID 0x5ba00477
}

jtag newtap $_CHIPNAME tap -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_DAP_TAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.tap

if { [info exists PS_TAPID] } {
	set _PS_TAPID $PS_TAPID
	jtag newtap $_CHIPNAME ps -irlen 12 -ircapture 0x1 -irmask 0x03 -expected-id $_PS_TAPID
} else {
	jtag newtap $_CHIPNAME ps -irlen 12 -ircapture 0x1 -irmask 0x03 -ignore-version \
		-expected-id 0x04711093 \
		-expected-id 0x04710093 \
		-expected-id 0x04721093 \
		-expected-id 0x04720093 \
		-expected-id 0x04739093 \
		-expected-id 0x04730093 \
		-expected-id 0x04738093 \
		-expected-id 0x04740093 \
		-expected-id 0x04750093 \
		-expected-id 0x04759093 \
		-expected-id 0x04758093
}

set jtag_configured 0

jtag configure $_CHIPNAME.ps -event setup {
	global _CHIPNAME
	global jtag_configured

	if { $jtag_configured == 0 } {
		irscan $_CHIPNAME.ps 0x824
		drscan $_CHIPNAME.ps 32 0x00000003
		runtest 100

		set jtag_configured 1
		jtag arp_init
	}
}

set _TARGETNAME $_CHIPNAME.a53
set _CTINAME $_CHIPNAME.cti
set DBGBASE {0x80410000 0x80510000 0x80610000 0x80710000}
set CTIBASE {0x80420000 0x80520000 0x80620000 0x80720000}
set _cores 4

for { set _core 0 } { $_core < $_cores } { incr _core } {
	cti create $_CTINAME.$_core -dap $_CHIPNAME.dap -ap-num 1 \
		-baseaddr [lindex $CTIBASE $_core]

	target create $_TARGETNAME.$_core aarch64 -dap $_CHIPNAME.dap \
		-dbgbase [lindex $DBGBASE $_core] -cti $_CTINAME.$_core
}

target create $_CHIPNAME.axi mem_ap -dap $_CHIPNAME.dap -ap-num 0

for { set _core 0 } { $_core < $_cores } { incr _core } {
	if { $_core != $A53_CORE } {
		$_TARGETNAME.$_core configure -gdb-port disabled
	}
}

targets $_TARGETNAME.$A53_CORE
