# Digilent JTAG-HS2 + Zynq UltraScale+ MPSoC Cortex-R5 (bare-metal).
# Used by :lua r5_baremetal_openocd_digilent
#
# Set R5_CORE before sourcing (0 or 1; default 0):
#   openocd -c "set R5_CORE 0" -f r5_openocd_digilent.cfg
#
# Assumes FSBL already ran (board booted normally). Selected RPU core
# gets the default GDB port; the other core's gdb-port is disabled.

# Inline HS2 (OpenOCD digilent-hs2.cfg expects "Digilent Adept USB Device";
# many probes report "Digilent USB Device" — match by vid/pid only).
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
reset_config none
transport select jtag

if { [info exists ADAPTER_KHZ] } {
	adapter speed $ADAPTER_KHZ
} else {
	adapter speed 4000
}

if { ![info exists R5_CORE] } {
	set R5_CORE 0
}

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME uscale
}

if { [info exists DAP_TAPID] } {
	set _DAP_TAPID $DAP_TAPID
} else {
	set _DAP_TAPID 0x5ba00477
}

jtag newtap $_CHIPNAME tap -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_DAP_TAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.tap

# PS tap (UltraScale+) — same expected-ids as target/xilinx_zynqmp.cfg
if { [info exists PS_TAPID] } {
	set _PS_TAPID $PS_TAPID
	jtag newtap $_CHIPNAME ps -irlen 12 -ircapture 0x1 -irmask 0x03 -expected-id $_PS_TAPID
} else {
	jtag newtap $_CHIPNAME ps -irlen 12 -ircapture 0x1 -irmask 0x03 -ignore-version \
		-expected-id 0x04711093 \
		-expected-id 0x04710093 \
		-expected-id 0x04721093 \
		-expected-id 0x04720093 \
		-expected-id 0x04739093 \
		-expected-id 0x04730093 \
		-expected-id 0x04738093 \
		-expected-id 0x04740093 \
		-expected-id 0x04750093 \
		-expected-id 0x04759093 \
		-expected-id 0x04758093
}

set jtag_configured 0

jtag configure $_CHIPNAME.ps -event setup {
	global _CHIPNAME
	global jtag_configured

	if { $jtag_configured == 0 } {
		# Enable DAP in the ZynqMP JTAG chain (UG1085 / Xilinx forum recipe).
		irscan $_CHIPNAME.ps 0x824
		drscan $_CHIPNAME.ps 32 0x00000003
		runtest 100

		set jtag_configured 1
		jtag arp_init
	}
}

# RPU debug bases (lock-step / split mode); OpenOCD uses cortex_r4 for R5.
target create $_CHIPNAME.r5.0 cortex_r4 -dap $_CHIPNAME.dap -dbgbase 0x803f0000 -coreid 0
target create $_CHIPNAME.r5.1 cortex_r4 -dap $_CHIPNAME.dap -dbgbase 0x803f2000 -coreid 1

if { $R5_CORE == 1 } {
	targets $_CHIPNAME.r5.1
	$_CHIPNAME.r5.0 configure -gdb-port disabled
} else {
	targets $_CHIPNAME.r5.0
	$_CHIPNAME.r5.1 configure -gdb-port disabled
}
