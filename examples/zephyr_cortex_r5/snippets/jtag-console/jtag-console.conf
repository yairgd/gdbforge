# Console over SEGGER RTT, through the debug probe. The R5 writes into a ring
# buffer in TCM and the probe pulls it out over the same JTAG cable, so no
# serial port is involved and Linux on the APU can keep uart0. With SERIAL=n
# Zephyr never touches the UART block at all. UART_XLNX_PS is turned off
# explicitly because kv260_r5_defconfig sets it, and it would otherwise be an
# unmet dependency once SERIAL is gone.
CONFIG_SERIAL=n
CONFIG_UART_XLNX_PS=n
CONFIG_UART_CONSOLE=n

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

# TRIM rather than the default SKIP: SKIP drops a whole message when no viewer
# is attached. BLOCK_IF_FIFO_FULL would hang the R5 when booting without a host.
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_TRIM=y

# The defaults (2 retries, 2ms apart) give each character a budget of just 4ms
# before the console gives up on it and marks the host as absent. A GDB server
# polls RTT far more slowly than that over JTAG on a Cortex-R, which made output
# stall at random. A 100ms budget plus a bigger buffer covers the gap between
# polls, at the cost of 4K of a 64K TCM.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_RTT_TX_RETRY_CNT=10
CONFIG_RTT_TX_RETRY_DELAY_MS=10
