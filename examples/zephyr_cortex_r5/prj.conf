# Console-agnostic configuration. The console backend comes from a snippet:
#   west build -b kv260_r5 . -S jtag-console    # SEGGER RTT over the probe
#   west build -b kv260_r5 . -S uart0-console   # PS UART0

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Source-level debugging. DEBUG_THREAD_INFO is not optional for the gdbforge
# zephyr profile: it emits the _kernel_thread_info_* offset tables the debug
# server walks to turn Zephyr threads into GDB threads. Without it both
# JLinkGDBServer and OpenOCD report a single hardware context.
CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_ASSERT=y

# Checks stay, messages go. This is a hard size constraint, not a preference:
# the ARMv7-R MPU can only describe power-of-two regions, so the linker rounds
# text+rodata up to one (MPU_ALIGN in the cortex_a_r linker script) and data and
# bss start after it. The verbose assert strings take rodata from 26,784 to
# 34,880 bytes, which crosses 32K, so the ROM region rounds to 64K and consumes
# the entire ATCM - the link then fails with "region RAM overflowed". Leaving it
# off keeps the ROM region at 32K with roughly 6K to spare, and the upper 32K
# free for data and bss. An assert still halts the core, which is what you want
# with a debugger attached anyway.
CONFIG_ASSERT_VERBOSE=n

# -Og, not -O0. CONFIG_NO_OPTIMIZATIONS=y gives better stepping but adds text,
# and per the note above there is only so much room before the ROM region
# doubles. Try it with -DCONFIG_NO_OPTIMIZATIONS=y on the build line.

# ARM mode throughout. The RPU vector table and the reset path are ARM, and
# mixing in Thumb-2 for the application buys nothing here.
CONFIG_COMPILER_ISA_THUMB2=n

# TTC0, not the ARM architected timer: psu_init only releases TTC0 from reset
# (RST_LPD_IOU2 bit 11). The driver picks its instance from the first enabled
# xlnx,ttcps node plus CONFIG_XLNX_PSTTC_TIMER_INDEX, and kv260_r5 enables only
# ttc0, so no chosen node is needed.
CONFIG_XLNX_PSTTC_TIMER=y
CONFIG_ARM_ARCH_TIMER=n
CONFIG_SYS_CLOCK_EXISTS=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=100000000
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
CONFIG_TICKLESS_KERNEL=n

# 4096 was tight: printf with CBPRINTF_COMPLETE on picolibc is stack-hungry.
# STACK_SENTINEL reports an overflow at the next context switch instead of
# letting it silently corrupt the neighbouring thread. It needs no MPU.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=512
CONFIG_STACK_SENTINEL=y

# No floating point anywhere, which also keeps printf off the soft-float path.
CONFIG_FPU=n
CONFIG_FPU_SHARING=n
CONFIG_PICOLIBC_IO_FLOAT=n
CONFIG_CBPRINTF_FP_SUPPORT=n

# sys_rand32_get() for the worker sleep jitter. The RPU has no entropy driver,
# so this picks TIMER_RANDOM_GENERATOR: an LCG stirred with the TTC counter.
# Fine for jitter, not for anything that needs real entropy.
CONFIG_TEST_RANDOM_GENERATOR=y
